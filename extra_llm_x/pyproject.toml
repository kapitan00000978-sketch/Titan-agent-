[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extra-llm-x"
version = "1.0.0"
description = "Extra LLM X — The Autonomous Free AI Gateway, Router, Model Discovery & Key Generator"
readme = "README.md"
authors = [{ name = "Extra LLM X Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.scripts]
extra-llm-x = "extra_llm_x.cli:main"
elx = "extra_llm_x.cli:main"
